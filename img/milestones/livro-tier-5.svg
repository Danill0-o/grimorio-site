<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" shape-rendering="crispEdges">
  <!-- Livro Tier 5: Expert (tomo carmesim + moldura dourada + gema rubi + fecho) -->
  <rect x="4" y="2" width="16" height="19" fill="#16070c"/>
  <!-- Capa carmesim -->
  <rect x="5" y="3" width="13" height="15" fill="#7f1d1d"/>
  <rect x="8" y="4" width="9" height="13" fill="#be123c"/>
  <!-- Moldura dourada interna -->
  <rect x="9" y="5" width="8" height="1" fill="#f59e0b"/>
  <rect x="9" y="15" width="8" height="1" fill="#f59e0b"/>
  <rect x="16" y="5" width="1" height="11" fill="#f59e0b"/>
  <!-- Lombada dourada -->
  <rect x="5" y="3" width="3" height="16" fill="#4c0519"/>
  <rect x="5" y="5" width="3" height="2" fill="#f59e0b"/>
  <rect x="5" y="10" width="3" height="2" fill="#f59e0b"/>
  <rect x="5" y="15" width="3" height="2" fill="#f59e0b"/>
  <!-- Cantoneiras duplas -->
  <rect x="15" y="3" width="3" height="3" fill="#fde047"/>
  <rect x="15" y="15" width="3" height="3" fill="#fde047"/>
  <!-- Folhas douradas -->
  <rect x="8" y="18" width="10" height="2" fill="#fef3c7"/>
  <rect x="18" y="4" width="1" height="15" fill="#fde68a"/>
  <!-- Fecho pesado com gema -->
  <rect x="16" y="8" width="4" height="5" fill="#d97706"/>
  <rect x="17" y="9" width="2" height="3" fill="#fde047"/>
  <!-- Medalhão central com rubi -->
  <rect x="10" y="8" width="5" height="5" fill="#f59e0b"/>
  <rect x="11" y="9" width="3" height="3" fill="#fb7185"/>
  <rect x="12" y="10" width="1" height="1" fill="#fff1f2"/>
  <!-- Fita marcadora -->
  <rect x="12" y="20" width="2" height="3" fill="#f59e0b"/>
</svg>
