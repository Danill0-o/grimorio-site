  <!-- Capa -->
  <rect x="6" y="4" width="12" height="14" fill="#165a40"/>
  <rect x="9" y="5" width="8" height="12" fill="#1e7a56"/>
  <!-- Lombada com 3 nervuras -->
  <rect x="6" y="4" width="3" height="15" fill="#0f3d2b"/>
  <rect x="6" y="6" width="3" height="1" fill="#d4a24c"/>
  <rect x="6" y="11" width="3" height="1" fill="#d4a24c"/>
  <rect x="6" y="15" width="3" height="1" fill="#d4a24c"/>
  <!-- Cantoneiras metálicas -->
  <rect x="15" y="4" width="3" height="2" fill="#d4a24c"/>
  <rect x="16" y="6" width="2" height="1" fill="#d4a24c"/>
  <rect x="15" y="16" width="3" height="2" fill="#d4a24c"/>
  <rect x="16" y="15" width="2" height="1" fill="#d4a24c"/>
  <!-- Folhas -->
  <rect x="9" y="18" width="9" height="1" fill="#f5ebd1"/>
  <rect x="18" y="5" width="1" height="13" fill="#d8cca8"/>
