<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" shape-rendering="crispEdges">
  <!-- Livro Tier 6: Mestre (códice ametista real + runa arcana luminosa + filigrana) -->
  <rect x="3" y="2" width="18" height="19" fill="#0c0618"/>
  <!-- Capa ametista -->
  <rect x="4" y="3" width="14" height="15" fill="#4c1d95"/>
  <rect x="8" y="4" width="9" height="13" fill="#6d28d9"/>
  <!-- Lombada com placas douradas -->
  <rect x="4" y="3" width="4" height="16" fill="#2e1065"/>
  <rect x="4" y="5" width="4" height="2" fill="#fbbf24"/>
  <rect x="4" y="9" width="4" height="2" fill="#fbbf24"/>
  <rect x="4" y="14" width="4" height="2" fill="#fbbf24"/>
  <!-- Filigrana de ouro -->
  <rect x="9" y="4" width="8" height="1" fill="#fde047"/>
  <rect x="9" y="16" width="8" height="1" fill="#fde047"/>
  <rect x="16" y="4" width="2" height="3" fill="#fbbf24"/>
  <rect x="16" y="14" width="2" height="3" fill="#fbbf24"/>
  <!-- Folhas iluminadas -->
  <rect x="8" y="18" width="11" height="2" fill="#fde68a"/>
  <rect x="18" y="4" width="1" height="15" fill="#facc15"/>
  <!-- Fecho com tranca de ouro -->
  <rect x="17" y="8" width="4" height="5" fill="#f59e0b"/>
  <rect x="18" y="9" width="2" height="3" fill="#38bdf8"/>
  <!-- Runa arcana brilhante na capa -->
  <rect x="11" y="7" width="3" height="7" fill="#38bdf8"/>
  <rect x="10" y="9" width="5" height="3" fill="#38bdf8"/>
  <rect x="12" y="8" width="1" height="5" fill="#e0f2fe"/>
  <rect x="11" y="10" width="3" height="1" fill="#e0f2fe"/>
  <!-- Duas fitas douradas -->
  <rect x="10" y="20" width="2" height="3" fill="#fde047"/>
  <rect x="14" y="20" width="2" height="2" fill="#38bdf8"/>
</svg>
